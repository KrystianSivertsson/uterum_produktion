<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nordiska — Välj system</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(160deg, #0f172a, #1e293b);
    color: #f1f5f9;
    padding: 24px;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    text-align: center;
    margin: 0 0 32px;
    color: #f8fafc;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
    gap: 20px;
  }
  a.card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;
    padding: 28px 24px;
    transition: transform 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  }
  a.card:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.25);
    transform: translateY(-2px);
  }
  .icon { font-size: 36px; margin-bottom: 12px; }
  .titel { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .beskrivning { font-size: 13px; color: #cbd5e1; line-height: 1.4; }
</style>
</head>
<body>
  <div class="wrap">
    <h1>Nordiska — Välj system</h1>
    <div class="grid">
      <a class="card" href="/produktion">
        <div class="icon">📦</div>
        <div class="titel">Produktion</div>
        <div class="beskrivning">Lager, kunder, stämpling och beredning — UterumLager</div>
      </a>
      <a class="card" href="/partiberedning">
        <div class="icon">🪟</div>
        <div class="titel">Parti beredning</div>
        <div class="beskrivning">ASE60-generatorn — konfigurera partier och exportera CNC-filer</div>
      </a>
    </div>
  </div>
</body>
</html>
